# Once a month: fetch NOAA's newest Mauna Loa CO2 file, rebuild
# data/co2_data.xlsx, run the tests and open a pull request if anything
# changed. Merge it, then re-deploy. Also runs on demand: Actions tab ->
# refresh-co2 -> Run workflow.
#
# One-time setting: Settings -> Actions -> General -> Workflow permissions ->
# tick "Allow GitHub Actions to create and approve pull requests".
name: refresh-co2

on:
  schedule:
    - cron: "17 6 9 * *"     # 06:17 UTC on the 9th; NOAA posts last month early in the month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Install testthat
        run: Rscript -e 'renv::install("testthat")'

      - name: Fetch NOAA's newest file and rebuild co2_data.xlsx
        id: refresh
        run: Rscript data-raw/update_maunaloa.R

      # Pull requests opened by this workflow don't start the tests workflow
      # (a GitHub rule), so test here before opening one.
      - name: Run the tests
        if: steps.refresh.outputs.changed == 'true'
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'

      - name: Open a pull request
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/maunaloa-refresh
          delete-branch: true
          add-paths: |
            data/rawData/co2_mm_mlo.csv
            data/co2_data.xlsx
          commit-message: "Data: Mauna Loa CO2 through ${{ steps.refresh.outputs.through }}"
          title: "Data: Mauna Loa CO₂ through ${{ steps.refresh.outputs.through }}"
          body: |
            ${{ steps.refresh.outputs.summary }}

            Made by the monthly `refresh-co2` workflow: downloaded NOAA's
            `co2_mm_mlo.csv`, checked it (`check_maunaloa_update()`), rebuilt
            `data/co2_data.xlsx` and ran the tests.

            After merging: pull, then `source("deploy/deploy_shinyapps.R")`.
