# Runs the testthat suite on every push (any branch), so a broken change shows
# up on GitHub before it is deployed. The packages are the app's own (DESCRIPTION:
# Imports + Suggests), installed as ready-made Linux binaries with pak and cached
# between runs. renv is switched off here: renv.lock stays what your Mac and
# shinyapps.io use.
name: tests

on:
  push:
    paths-ignore:          # docs-only pushes don't need a test run
      - "**.md"
      - "output/**"
  workflow_dispatch:       # Actions tab -> tests -> Run workflow

permissions:
  contents: read

jobs:
  testthat:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to a new Ubuntu in late 2026
    timeout-minutes: 20
    env:
      LANG: C.UTF-8        # the enrichment tests use Swedish characters
      LC_ALL: C.UTF-8
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"   # don't let .Rprofile start renv here
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv        # the R version in renv.lock
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat

      - name: Run the tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
