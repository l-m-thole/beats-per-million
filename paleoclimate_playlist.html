      const bpm = BPM_CONFIG.min + ((BPM_CONFIG.max - BPM_CONFIG.min) / (maxCo2 - minCo2)) * (co2 - minCo2);

    };
    
    const getBpmColor = (bpm) => {
      const ratio = (bpm - BPM_CONFIG.min) / (BPM_CONFIG.max - BPM_CONFIG.min);
      const r = Math.round(59 + ratio * 180);
      const g = Math.round(130 - ratio * 62);
      const b = Math.round(246 - ratio * 178);
      return `rgb(${r}, ${g}, ${b})`;
    };
    
    // Generate playlist data for a time period
    const generatePlaylist = (period) => {
      const data = period.dataSource === 'modern' 
        ? CO2_DATA.modern 
        : CO2_DATA.icecore.filter(d => d.age <= period.filterMaxAge);
      
      if (data.length === 0) return { songs: [], stats: null };
      
      const co2Values = data.map(d => d.co2);
      const minCo2 = Math.min(...co2Values);
      const maxCo2 = Math.max(...co2Values);
      
      const playlistMinutes = period.yearsSpan / period.yearsPerMinute;
      const numSongs = Math.ceil(playlistMinutes / 3); // 3 min average song
      const yearsPerSong = period.yearsSpan / numSongs;
      
      // Generate songs
      const songs = [];
      for (let i = 0; i < numSongs; i++) {
        const startAge = i * yearsPerSong;
        const endAge = (i + 1) * yearsPerSong;
        
        // Find data points in this range
        const relevantData = data.filter(d => {
          const age = d.age < 0 ? -d.age : d.age;
          return age >= startAge && age < endAge;
        });
        
        let avgCo2;
        if (relevantData.length > 0) {
          avgCo2 = relevantData.reduce((sum, d) => sum + d.co2, 0) / relevantData.length;
        } else {
          // Interpolate
          const ratio = (startAge + endAge) / 2 / period.yearsSpan;
          avgCo2 = minCo2 + ratio * (maxCo2 - minCo2) * (period.dataSource === 'modern' ? 1 : -0.5 + Math.random());
        }
        
        const bpm = co2ToBpm(avgCo2, minCo2, maxCo2);
        
        songs.push({
          number: i + 1,
          startAge: period.dataSource === 'modern' ? -endAge : startAge,
          endAge: period.dataSource === 'modern' ? -startAge : endAge,
          avgCo2: Math.round(avgCo2),
          bpm,
          mood: getMoodFromBpm(bpm)
        });
      }
      
      // Reverse for modern era to go from past to present
      if (period.dataSource === 'modern') {
        songs.reverse();
        songs.forEach((s, i) => s.number = i + 1);
      }
      
      const stats = {
        totalYears: period.yearsSpan,
        playlistMinutes: Math.round(playlistMinutes),
        numSongs,
        co2Range: [Math.round(minCo2), Math.round(maxCo2)],
        bpmRange: [BPM_CONFIG.min, BPM_CONFIG.max]
      };
      
      return { songs, stats, data };
    };
    
    // Components
    const Timeline = ({ data, currentSong, period, onSongSelect }) => {
      const width = 100;
      const height = 100;
      const padding = { top: 10, right: 10, bottom: 20, left: 10 };
      
      const filteredData = period.dataSource === 'modern' 
        ? data 
        : data.filter(d => d.age <= period.filterMaxAge);
      
      if (filteredData.length < 2) return null;
      
      const ages = filteredData.map(d => d.age);
      const co2s = filteredData.map(d => d.co2);
      const minAge = Math.min(...ages);
      const maxAge = Math.max(...ages);
      const minCo2 = Math.min(...co2s);
      const maxCo2 = Math.max(...co2s);
      
      const xScale = (age) => padding.left + ((age - minAge) / (maxAge - minAge)) * (width - padding.left - padding.right);
      const yScale = (co2) => height - padding.bottom - ((co2 - minCo2) / (maxCo2 - minCo2)) * (height - padding.top - padding.bottom);
      
      const pathD = filteredData.map((d, i) => 
        `${i === 0 ? 'M' : 'L'} ${xScale(d.age)} ${yScale(d.co2)}`
      ).join(' ');
      
      const areaD = pathD + ` L ${xScale(filteredData[filteredData.length-1].age)} ${height - padding.bottom} L ${xScale(filteredData[0].age)} ${height - padding.bottom} Z`;
      
      // Current song marker position
      let markerX = 50;
      if (currentSong) {
        const songAge = (currentSong.startAge + currentSong.endAge) / 2;
        markerX = xScale(songAge);
      }
      
      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="timeline-svg" preserveAspectRatio="none">
          <defs>
            <linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="#667eea" stopOpacity="0.4"/>
              <stop offset="100%" stopColor="#667eea" stopOpacity="0"/>
            </linearGradient>
            <linearGradient id="lineGradient" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0%" stopColor="#3b82f6"/>
              <stop offset="50%" stopColor="#8b5cf6"/>
              <stop offset="100%" stopColor="#ef4444"/>
            </linearGradient>
          </defs>
          
          {/* Axis */}
          <line 
            x1={padding.left} y1={height - padding.bottom} 
            x2={width - padding.right} y2={height - padding.bottom} 
            className="timeline-axis"
          />
          
          {/* Area fill */}
          <path d={areaD} fill="url(#areaGradient)" className="timeline-area"/>
          
          {/* Line */}
          <path d={pathD} stroke="url(#lineGradient)" className="timeline-path"/>
          
          {/* Current position marker */}
          {currentSong && (
            <g transform={`translate(${markerX}, 0)`}>
              <line y1={padding.top} y2={height - padding.bottom} stroke="white" strokeWidth="0.5" strokeDasharray="2,2" opacity="0.5"/>
              <circle cy={yScale(currentSong.avgCo2)} r="3" className="current-song-indicator"/>
            </g>
          )}
          
          {/* Axis labels */}
          <text x={padding.left} y={height - 5} fill="#a1a1aa" fontSize="3" fontFamily="JetBrains Mono">
            {period.dataSource === 'modern' ? '1958' : 'Present'}
          </text>
          <text x={width - padding.right} y={height - 5} fill="#a1a1aa" fontSize="3" fontFamily="JetBrains Mono" textAnchor="end">
            {period.dataSource === 'modern' ? 'Now' : formatAge(period.filterMaxAge, period.id)}
          </text>
        </svg>
      );
    };
    
    const SongItem = ({ song, isActive, onClick, minBpm, maxBpm }) => {
      const bpmRatio = (song.bpm - minBpm) / (maxBpm - minBpm);
      const bpmColor = getBpmColor(song.bpm);
      
      return (
        <div 
          className={`song-item ${isActive ? 'active' : ''}`}
          onClick={onClick}
        >
          <div className="song-number">#{song.number}</div>
          <div className="song-info">
            <div className="song-era">{formatAge(song.startAge)} → {formatAge(song.endAge)}</div>
            <div className="song-co2">{song.avgCo2} ppm CO₂</div>
          </div>
          <div className="bpm-bar">
            <div 
              className="bpm-fill" 
              style={{ 
                width: `${bpmRatio * 100}%`,
                background: bpmColor
              }}
            />
          </div>
          <div className="song-bpm" style={{ color: bpmColor }}>{song.bpm}</div>
        </div>
      );
    };
    
    const NowPlaying = ({ song }) => {
      if (!song) return null;
      const bpmColor = getBpmColor(song.bpm);
      
      return (
        <div className="now-playing">
          <div className="now-playing-header">
            <div className="pulse-dot"></div>
            <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>NOW PLAYING</span>
          </div>
          <div className="now-playing-content">
            <div>
              <div className="np-detail">
                <span className="np-label">Time Period</span>
                <span className="np-value">{formatAge(song.startAge)} → {formatAge(song.endAge)}</span>
              </div>
              <div className="np-detail" style={{ marginTop: '0.75rem' }}>
                <span className="np-label">CO₂ Concentration</span>
                <span className="np-value">{song.avgCo2} ppm</span>
              </div>
            </div>
            <div>
              <div className="bpm-indicator">
                <span className="bpm-large" style={{ color: bpmColor }}>{song.bpm}</span>
                <span className="bpm-unit">BPM</span>
              </div>
              <div className="mood-tag">{song.mood.mood} • {song.mood.genre}</div>
            </div>
          </div>
        </div>
      );
    };
    
    const App = () => {
      const [selectedPeriod, setSelectedPeriod] = React.useState('modern');
      const [currentSongIndex, setCurrentSongIndex] = React.useState(0);
      
      const period = TIME_PERIODS[selectedPeriod];
      const { songs, stats, data } = React.useMemo(() => generatePlaylist(period), [period]);
      const currentSong = songs[currentSongIndex];
      
      const handlePeriodChange = (periodId) => {
        setSelectedPeriod(periodId);
        setCurrentSongIndex(0);
      };
      
      const openSpotify = () => {
        const searchQuery = `${currentSong.bpm} bpm ${currentSong.mood.genre.split('/')[0].trim()}`;
        window.open(`https://open.spotify.com/search/${encodeURIComponent(searchQuery)}`, '_blank');
      };
      
      const openSoundcloud = () => {
        const searchQuery = `${currentSong.bpm} bpm ${currentSong.mood.genre.split('/')[0].trim()}`;
        window.open(`https://soundcloud.com/search?q=${encodeURIComponent(searchQuery)}`, '_blank');
      };
      
      return (
        <div className="app-container">
          <header className="header">
            <div className="header-content">
              <div className="logo">
                <div className="logo-icon">🌍</div>
                <div className="logo-text">
                  <h1>Paleoclimate Playlist</h1>
                  <span>Earth's Climate History as Music</span>
                </div>
              </div>
            </div>
          </header>
          
          <main className="main-content">
            <aside className="sidebar">
              <div className="period-selector">
                <h2>Select Time Period</h2>
                {Object.values(TIME_PERIODS).map(p => (
                  <button
                    key={p.id}
                    className={`period-btn ${selectedPeriod === p.id ? 'active' : ''}`}
                    onClick={() => handlePeriodChange(p.id)}
                  >
                    {p.name}
                    <span className="period-years">{p.subtitle}</span>
                  </button>
                ))}
              </div>
              
              <div className="info-card">
                <h3>About This Period</h3>
                <p>{period.description}</p>
              </div>
              
              <div className="info-card">
                <h3>How It Works</h3>
                <p>
                  CO₂ concentrations are mapped to beats per minute (BPM). 
                  Lower CO₂ (ice ages, ~180 ppm) = slower, melancholic music at 60 BPM. 
                  Higher CO₂ (modern era, 420+ ppm) = faster, energetic music up to 150 BPM.
                </p>
              </div>
            </aside>
            
            <div className="main-panel">
              <div className="visualization-card">
                <div className="viz-header">
                  <div className="viz-title">
                    <h2>{period.name}</h2>
                    <span>{period.subtitle}</span>
                  </div>
                </div>
                
                {stats && (
                  <div className="stats-grid">
                    <div className="stat-box">
                      <div className="stat-value">{stats.totalYears.toLocaleString()}</div>
                      <div className="stat-label">Years Covered</div>
                    </div>
                    <div className="stat-box">
                      <div className="stat-value gold">{stats.numSongs}</div>
                      <div className="stat-label">Songs</div>
                    </div>
                    <div className="stat-box">
                      <div className="stat-value cold">{stats.co2Range[0]}</div>
                      <div className="stat-label">Min CO₂ (ppm)</div>
                    </div>
                    <div className="stat-box">
                      <div className="stat-value warm">{stats.co2Range[1]}</div>
                      <div className="stat-label">Max CO₂ (ppm)</div>
                    </div>
                  </div>
                )}
                
                <div className="timeline-container">
                  <Timeline 
                    data={period.dataSource === 'modern' ? CO2_DATA.modern : CO2_DATA.icecore}
                    currentSong={currentSong}
                    period={period}
                    onSongSelect={setCurrentSongIndex}
                  />
                </div>
                
                <div className="legend">
                  <div className="legend-item">
                    <div className="legend-dot cold"></div>
                    <span>Low CO₂ / Slow BPM</span>
                  </div>
                  <div className="legend-item">
                    <div className="legend-dot warm"></div>
                    <span>High CO₂ / Fast BPM</span>
                  </div>
                </div>
              </div>
              
              <div className="playlist-section">
                <div className="playlist-header">
                  <h2>Playlist ({songs.length} songs • ~{stats?.playlistMinutes || 0} minutes)</h2>
                  <div className="platform-links">
                    <button className="platform-btn spotify-btn" onClick={openSpotify}>
                      🎵 Spotify
                    </button>
                    <button className="platform-btn soundcloud-btn" onClick={openSoundcloud}>
                      ☁️ SoundCloud
                    </button>
                  </div>
                </div>
                
                <NowPlaying song={currentSong} />
                
                <div className="song-list">
                  {songs.map((song, index) => (
                    <SongItem
                      key={song.number}
                      song={song}
                      isActive={index === currentSongIndex}
                      onClick={() => setCurrentSongIndex(index)}
                      minBpm={BPM_CONFIG.min}
                      maxBpm={BPM_CONFIG.max}
                    />
                  ))}
                </div>
              </div>
            </div>
          </main>
          
          <footer className="footer">
            <p>
              Data sources: <a href="https://gml.noaa.gov/ccgg/trends/" target="_blank">NOAA Mauna Loa CO₂</a> • 
              <a href="https://www.ncei.noaa.gov/access/paleo-search/" target="_blank"> NOAA Paleoclimatology</a> (Bereiter et al., 2015)
            </p>
            <p style={{ marginTop: '0.5rem', opacity: 0.7 }}>
              Click on songs to see their time period details. Use the Spotify/SoundCloud buttons to find matching music!
            </p>
          </footer>
        </div>
      );
    };
    
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
